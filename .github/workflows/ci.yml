name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test core + server + direct mode
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:jvmTest :server:test :app:shared:jvmTest
