name: Build & Release Artifacts

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run JVM and Android unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:jvmTest :server:test :app:shared:jvmTest :app:androidApp:testDebugUnitTest

  build-android:
    name: Build Android APK
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:androidApp:assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/androidApp/build/outputs/apk/debug/androidApp-debug.apk

  build-server:
    name: Build Server Distribution
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build Server Distribution
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :server:installDist

      - name: Upload Server Dist
        uses: actions/upload-artifact@v4
        with:
          name: server-distribution
          path: server/build/install/server/
